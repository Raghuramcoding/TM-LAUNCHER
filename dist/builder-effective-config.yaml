directories:
  output: dist
  buildResources: build
appId: com.tmlauncher.app
productName: TMLauncher
files:
  - filter:
      - index.html
      - styles.css
      - modal.css
      - app.js
      - electron-main.js
      - preload.js
      - package.json
win:
  target:
    - portable
    - nsis
portable:
  artifactName: TMLauncher-Portable-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
electronVersion: 42.5.0